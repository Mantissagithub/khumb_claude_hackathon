<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KumbhSeva — Report an Issue</title>
  <style>
    body { margin: 0; background: #0f1115; color: #e9edf5;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; padding: 32px 16px; }
    .wrap { width: 100%; max-width: 460px; }
    h1 { font-size: 20px; }
    p.sub { color: #8b93a7; font-size: 14px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; color: #c4ccdc; }
    input, textarea, button { width: 100%; font: inherit; border-radius: 10px;
      border: 1px solid #2a2f3a; background: #1a1d24; color: #e9edf5; padding: 11px; }
    textarea { min-height: 90px; resize: vertical; }
    button { margin-top: 18px; background: #e9883b; color: #1a1206; border: none;
      font-weight: 700; cursor: pointer; }
    .result { margin-top: 20px; padding: 14px; border-radius: 10px;
      border: 1px solid #2a2f3a; background: #12151b; font-size: 14px; display: none; }
    .result.show { display: block; }
    .k { color: #8b93a7; }
    .merged { color: #ff8ad4; }
    .new { color: #3fb27f; }
    a { color: #4c9be8; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🕉️ Report an Issue</h1>
    <p class="sub">Describe the problem in any language. The control room is
      notified instantly with an AI-suggested department.</p>

    <label>What is the problem? *</label>
    <textarea id="description" placeholder="e.g. My 6-year-old son is lost near Sangam Ghat"></textarea>

    <label>Location / Zone</label>
    <input id="zone" placeholder="e.g. Sector 7, near the main bridge" />

    <label>Your name</label>
    <input id="reporter_name" placeholder="optional" />

    <label>Contact number</label>
    <input id="reporter_contact" placeholder="optional" />

    <button onclick="submitIssue()">Send to Control Room</button>

    <div class="result" id="result"></div>
    <p class="sub" style="margin-top:24px"><a href="/admin">→ Open Admin Dashboard</a></p>
  </div>

  <script>
    async function submitIssue() {
      const description = document.getElementById('description').value.trim();
      if (!description) { alert('Please describe the problem.'); return; }
      const body = {
        description,
        zone: document.getElementById('zone').value.trim() || null,
        reporter_name: document.getElementById('reporter_name').value.trim() || null,
        reporter_contact: document.getElementById('reporter_contact').value.trim() || null,
      };
      const r = await fetch('/api/v1/issues', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await r.json();
      const ai = data.ticket.ai_analysis || {};
      const box = document.getElementById('result');
      box.className = 'result show';
      box.innerHTML = `
        <div class="${data.merged ? 'merged' : 'new'}">
          ${data.merged ? '↪ Merged with an existing report' : '✓ Ticket created'} —
          <b>${data.ticket.ticket_id}</b></div>
        <div style="margin-top:8px"><span class="k">Routed to:</span> ${ai.suggested_department || '—'}</div>
        <div><span class="k">Priority:</span> ${ai.priority || '—'}</div>
        <div><span class="k">Language:</span> ${ai.language || '—'}</div>
        ${ai.nearest_asset ? `<div><span class="k">Nearest asset:</span> ${ai.nearest_asset}</div>` : ''}
        <div style="margin-top:6px">${data.message}</div>`;
      document.getElementById('description').value = '';
    }
  </script>
</body>
</html>
