<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sahayak — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen bg-slate-900 text-slate-100">
  <header class="bg-slate-950/80 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-5 py-4 flex items-center gap-4">
      <a href="index.html" class="text-2xl font-extrabold">🪔 Sahayak</a>
      <span class="px-2 py-0.5 bg-indigo-600 rounded text-sm">Admin Control Room</span>
      <div class="ml-auto flex items-center gap-2 text-sm">
        <span id="dot" class="w-3 h-3 rounded-full bg-rose-400"></span>
        <span id="live">0 live</span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-5 py-6">
    <div id="stats" class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6"></div>

    <div class="grid lg:grid-cols-2 gap-6">
      <section>
        <h2 class="text-lg font-bold mb-3 flex items-center gap-2">🎯 Matches to review
          <span id="qcount" class="text-xs bg-amber-500 text-slate-900 px-2 py-0.5 rounded-full">0</span></h2>
        <div id="queue" class="space-y-3"></div>
      </section>

      <section>
        <h2 class="text-lg font-bold mb-3">🗺️ Centers</h2>
        <div id="map" class="h-64 rounded-xl overflow-hidden mb-5 border border-slate-700"></div>
        <h2 class="text-lg font-bold mb-3">🗂️ Recent cases</h2>
        <div id="cases" class="space-y-2 max-h-80 overflow-auto pr-1"></div>
      </section>
    </div>
  </main>

  <script src="common.js"></script>
  <script>
    let map, centerLayer;
    async function initMap() {
      map = L.map("map", { attributionControl: false }).setView([19.99, 73.72], 11);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(map);
      centerLayer = L.layerGroup().addTo(map);
      const cs = await jget("/api/centers");
      cs.forEach(c => L.marker([c.lat, c.lng]).addTo(centerLayer).bindPopup(c.name));
    }

    async function loadStats() {
      const s = await jget("/api/stats");
      $("#live").textContent = s.live_connections + " live";
      const cards = [
        ["Total", s.total, "bg-slate-800"], ["Missing", s.missing, "bg-pink-900/60"],
        ["Found", s.found, "bg-orange-900/60"], ["Reunited", s.reunited, "bg-emerald-800/70"],
        ["Open", s.open, "bg-slate-800"], ["To review", s.pending_matches, "bg-amber-700/70"],
      ];
      $("#stats").innerHTML = cards.map(([k, v, c]) =>
        `<div class="${c} rounded-xl p-4"><div class="text-3xl font-extrabold">${v}</div><div class="text-xs uppercase tracking-wide text-slate-300">${k}</div></div>`).join("");
    }

    function personCard(p, label, color) {
      if (!p) return `<div class="flex-1 text-slate-500">—</div>`;
      return `<div class="flex-1 text-center">
        <div class="text-xs ${color} font-bold uppercase">${label}</div>
        ${p.has_photo ? `<img src="${photoUrl(p.id)}" class="w-24 h-24 object-cover rounded-xl mx-auto my-1" />`
          : `<div class="w-24 h-24 rounded-xl bg-slate-700 grid place-items-center text-2xl font-bold mx-auto my-1">${initials(p.name)}</div>`}
        <div class="font-semibold">${p.name || "(no name)"}</div>
        <div class="text-xs text-slate-400">${p.id} · ${p.center || ""}</div>
        <div class="text-xs text-slate-500">${p.location || ""}</div>
      </div>`;
    }

    async function loadQueue() {
      const cands = await jget("/api/candidates");
      $("#qcount").textContent = cands.length;
      $("#queue").innerHTML = cands.map(c => `
        <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700">
          <div class="flex items-center gap-3 mb-3">
            <span class="px-3 py-1 rounded-lg border ${bandClass(c.band)} font-bold">${c.confidence_pct}%</span>
            <span class="font-bold">${c.verdict}</span>
            <span class="ml-auto text-xs text-slate-400">${c.id} · score ${c.score}</span>
          </div>
          <div class="flex items-center gap-3">
            ${personCard(c.missing, "Missing", "text-pink-400")}
            <div class="text-2xl">↔️</div>
            ${personCard(c.found, "Found", "text-orange-400")}
          </div>
          <div class="flex gap-2 mt-4">
            <button onclick="resolve('${c.id}','confirm')" class="flex-1 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 font-bold">✅ Confirm reunification</button>
            <button onclick="resolve('${c.id}','reject')" class="flex-1 py-2 rounded-lg bg-slate-600 hover:bg-slate-500 font-bold">✖ Reject</button>
          </div>
        </div>`).join("") || `<p class="text-slate-500">No matches awaiting review.</p>`;
    }

    async function loadCases() {
      const cs = await jget("/api/cases");
      $("#cases").innerHTML = cs.slice(0, 20).map(c => `
        <div class="bg-slate-800 rounded-lg px-3 py-2 flex items-center gap-3 text-sm">
          <span class="px-1.5 py-0.5 rounded text-xs ${c.type === 'found' ? 'bg-orange-900 text-orange-200' : 'bg-pink-900 text-pink-200'}">${c.type}</span>
          <span class="font-semibold">${c.name || "(no name)"}</span>
          <span class="text-slate-400">${c.id} · ${c.center || ""}</span>
          <span class="ml-auto px-2 py-0.5 rounded text-xs ${c.status === 'reunited' ? 'bg-emerald-800 text-emerald-200' : 'bg-slate-700 text-slate-300'}">${c.status}</span>
        </div>`).join("") || `<p class="text-slate-500">No cases yet.</p>`;
    }

    window.resolve = async (id, action) => {
      await jpost(`/api/candidates/${id}/${action}`, null);
      toast(action === "confirm" ? "✅ Reunification confirmed." : "Match rejected.",
            action === "confirm" ? "success" : "info");
      refresh();
    };

    function refresh() { loadStats(); loadQueue(); loadCases(); }

    connectWS({
      role: "admin",
      onStatus: ok => $("#dot").className = "w-3 h-3 rounded-full " + (ok ? "bg-emerald-400 pulse-dot" : "bg-rose-400"),
      onEvent: (ev, data) => {
        if (ev === "match.candidate") toast(`🔔 New match candidate — ${data.confidence_pct}% (${data.band})`, "warn", 9000);
        if (ev === "case.created") toast(`➕ New ${data.type} case at ${data.center}`, "info", 4000);
        refresh();
      }
    });

    initMap(); refresh();
  </script>
</body>
</html>
