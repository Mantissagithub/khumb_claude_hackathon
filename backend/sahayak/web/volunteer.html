<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sahayak — Volunteer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <header class="kumbh-gradient text-white">
    <div class="max-w-4xl mx-auto px-5 py-4 flex items-center gap-4">
      <a href="index.html" class="text-2xl font-extrabold">🪔 Sahayak</a>
      <span class="px-2 py-0.5 bg-white/20 rounded text-sm">Volunteer</span>
      <div class="ml-auto flex items-center gap-3">
        <select id="center" class="text-slate-800 rounded-lg px-3 py-1.5 text-sm"></select>
        <span id="dot" class="w-3 h-3 rounded-full bg-rose-400" title="offline"></span>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-5 py-6">
    <div class="flex gap-2 mb-4">
      <button data-type="found" class="tab flex-1 py-3 rounded-xl font-bold text-lg shadow">🔎 Register FOUND person</button>
      <button data-type="missing" class="tab flex-1 py-3 rounded-xl font-bold text-lg shadow">📢 Register MISSING report</button>
    </div>

    <div class="bg-white rounded-2xl shadow p-6">
      <p id="formhint" class="text-slate-500 mb-4"></p>
      <form id="form" class="grid md:grid-cols-2 gap-4">
        <div class="md:col-span-2 flex items-center gap-4">
          <label class="cursor-pointer">
            <span class="inline-block px-4 py-2 bg-indigo-600 text-white rounded-lg font-semibold">📷 Add photo</span>
            <input id="photo" type="file" accept="image/*" capture="environment" class="hidden" />
          </label>
          <img id="preview" class="h-20 w-20 object-cover rounded-lg border hidden" />
          <span id="photoname" class="text-sm text-slate-500">Photo strongly recommended — enables face matching.</span>
        </div>
        <input name="name" placeholder="Name (optional)" class="border rounded-lg px-3 py-2" />
        <input name="reporter_mobile" placeholder="Contact mobile (optional)" class="border rounded-lg px-3 py-2" />
        <select name="gender" class="border rounded-lg px-3 py-2">
          <option value="">Gender (optional)</option><option>Male</option><option>Female</option><option>Unknown</option>
        </select>
        <select name="age_band" class="border rounded-lg px-3 py-2">
          <option value="">Age band (optional)</option>
          <option>0-12</option><option>13-17</option><option>18-40</option>
          <option>41-60</option><option>61-70</option><option>71-80</option><option>80+</option>
        </select>
        <input name="location" placeholder="Last seen / found location" class="border rounded-lg px-3 py-2 md:col-span-2" />
        <textarea name="description" placeholder="Clothing / appearance notes" class="border rounded-lg px-3 py-2 md:col-span-2"></textarea>
        <button id="submit" type="submit" class="md:col-span-2 py-3 rounded-xl bg-emerald-600 text-white font-bold text-lg">Submit & match</button>
      </form>
    </div>

    <div id="result" class="mt-5"></div>

    <h3 class="mt-8 mb-2 font-bold text-slate-600">Recent cases at this center</h3>
    <div id="cases" class="grid sm:grid-cols-2 gap-3"></div>
  </main>

  <script src="common.js"></script>
  <script>
    let TYPE = "found", CENTER = "", sock = null;
    const tabs = $all(".tab");
    function paintTabs() {
      tabs.forEach(t => {
        const on = t.dataset.type === TYPE;
        t.className = "tab flex-1 py-3 rounded-xl font-bold text-lg shadow " +
          (on ? (TYPE === "found" ? "bg-orange-500 text-white" : "bg-pink-600 text-white")
              : "bg-white text-slate-500");
      });
      $("#formhint").textContent = TYPE === "found"
        ? "A volunteer found this person (e.g. lost/unconscious). We'll match against open MISSING reports."
        : "A family is looking for this person. We'll match against people already FOUND.";
    }
    tabs.forEach(t => t.onclick = () => { TYPE = t.dataset.type; paintTabs(); });

    $("#photo").onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      $("#photoname").textContent = f.name;
      const img = $("#preview"); img.src = URL.createObjectURL(f); img.classList.remove("hidden");
    };

    async function loadCenters() {
      const cs = await jget("/api/centers");
      $("#center").innerHTML = cs.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
      CENTER = cs[0].id; openSock();
      loadCases();
    }
    function openSock() {
      sock && sock.close();
      sock = connectWS({
        center: CENTER,
        onStatus: ok => { const d = $("#dot"); d.className = "w-3 h-3 rounded-full " + (ok ? "bg-emerald-400 pulse-dot" : "bg-rose-400"); },
        onEvent: (ev, data) => {
          if (ev === "match.candidate") {
            toast(`🔔 <b>Possible match</b> for a case at your center — ${data.confidence_pct}% (${data.band}).`, "warn", 9000);
            loadCases();
          } else if (ev === "match.resolved") {
            toast(`✅ A match was <b>${data.status}</b> by the control room.`, "success");
            loadCases();
          } else if (ev === "case.created") { loadCases(); }
        }
      });
    }
    $("#center").onchange = e => { CENTER = e.target.value; openSock(); loadCases(); };

    async function loadCases() {
      const cs = await jget("/api/cases?center=" + encodeURIComponent(CENTER));
      $("#cases").innerHTML = cs.slice(0, 8).map(c => `
        <div class="bg-white rounded-xl p-3 flex gap-3 items-center shadow-sm">
          ${c.has_photo ? `<img src="${photoUrl(c.id)}" class="w-12 h-12 rounded-lg object-cover" />`
            : `<div class="w-12 h-12 rounded-lg bg-slate-200 grid place-items-center font-bold text-slate-500">${initials(c.name)}</div>`}
          <div class="min-w-0">
            <div class="font-semibold truncate">${c.name || "(no name)"} <span class="text-xs px-1.5 py-0.5 rounded ${c.type === 'found' ? 'bg-orange-100 text-orange-700' : 'bg-pink-100 text-pink-700'}">${c.type}</span></div>
            <div class="text-xs text-slate-500">${c.id} · ${c.status}${c.location ? ' · ' + c.location : ''}</div>
          </div>
        </div>`).join("") || `<p class="text-slate-400 text-sm">No cases yet.</p>`;
    }

    $("#form").onsubmit = async (e) => {
      e.preventDefault();
      const btn = $("#submit"); btn.disabled = true; btn.textContent = "Matching…";
      const fd = new FormData(e.target);
      fd.set("type", TYPE); fd.set("center", CENTER);
      const ph = $("#photo").files[0]; if (ph) fd.set("photo", ph);
      try {
        const r = await jpost("/api/cases/register", fd);
        renderResult(r);
        e.target.reset(); $("#preview").classList.add("hidden");
        $("#photoname").textContent = "Photo strongly recommended — enables face matching.";
        loadCases();
      } catch (err) { toast("Error: " + err, "error"); }
      btn.disabled = false; btn.textContent = "Submit & match";
    };

    function renderResult(r) {
      const cands = r.candidates || [];
      const head = `<div class="bg-white rounded-2xl shadow p-5">
        <div class="font-bold text-lg">Registered ${r.case.id}
          <span class="text-sm font-normal text-slate-500">· face ${r.face_detected ? 'detected ✅' : 'not detected ⚠️'}</span></div>`;
      if (!cands.length) {
        $("#result").innerHTML = head + `<p class="mt-2 text-slate-600">No matching person found yet. We'll alert you the moment a match appears at any center.</p></div>`;
        return;
      }
      const rows = cands.map(c => {
        const other = TYPE === "found" ? c.missing : c.found;
        return `<div class="flex items-center gap-3 border rounded-xl p-3 mt-2">
          <span class="px-2 py-1 rounded-lg border ${bandClass(c.band)} text-sm font-bold">${c.confidence_pct}%</span>
          <div class="flex-1"><b>${c.verdict}</b> — ${other ? (other.name || other.id) : ''} <span class="text-xs text-slate-500">(${other ? other.center : ''})</span></div>
          ${other && other.has_photo ? `<img src="${photoUrl(other.id)}" class="w-12 h-12 rounded-lg object-cover" />` : ''}
        </div>`;
      }).join("");
      $("#result").innerHTML = head + `<p class="mt-2 text-slate-600">Possible match(es) sent to the control room for confirmation:</p>${rows}</div>`;
      toast(`🎯 ${cands.length} possible match(es) found — sent to control room.`, "success");
    }

    paintTabs(); loadCenters();
  </script>
</body>
</html>
